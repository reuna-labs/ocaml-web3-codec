name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: [4.14.2, 5.2.1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true
      - name: Build the GMP prerequisite without host privileges
        env:
          GMP_VERSION: "6.3.0"
          GMP_SHA256: a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898
        run: |
          archive="$RUNNER_TEMP/gmp-$GMP_VERSION.tar.xz"
          source_dir="$(mktemp --directory "$RUNNER_TEMP/gmp-build.XXXXXX")"
          gmp_prefix="$RUNNER_TEMP/ocaml-codec-gmp-${{ matrix.ocaml-compiler }}"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --output "$archive" \
            "https://ftp.gnu.org/gnu/gmp/gmp-$GMP_VERSION.tar.xz"
          echo "$GMP_SHA256  $archive" | sha256sum --check --strict
          tar --extract --xz --file "$archive" --directory "$source_dir" \
            --strip-components 1
          cd "$source_dir"
          ./configure --prefix="$gmp_prefix" --with-pic
          make -j"$(nproc)"
          make install
          {
            echo "CPATH=$gmp_prefix/include"
            echo "LIBRARY_PATH=$gmp_prefix/lib"
            echo "LD_LIBRARY_PATH=$gmp_prefix/lib"
            echo "PKG_CONFIG_PATH=$gmp_prefix/lib/pkgconfig"
          } >> "$GITHUB_ENV"
      - run: opam pin add digestif.1.4.0 "git+https://github.com/reuna-labs/digestif.git#v1.4.0-alpha1" --no-action --yes
      - run: opam pin add evm-abi.0.2.0~alpha1 "git+https://github.com/reuna-labs/ocaml-evm.git#v0.2.0-alpha1" --no-action --yes
      - run: opam pin add evm-types.0.2.0~alpha1 "git+https://github.com/reuna-labs/ocaml-evm.git#v0.2.0-alpha1" --no-action --yes
      - run: opam install . --assume-depexts --deps-only --with-test --yes
      - run: opam exec -- dune build @install @runtest
      - run: opam lint ./*.opam
